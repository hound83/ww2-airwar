name: Atlas core checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm generated GitHub Pages assets are current
        run: |
          node scripts/build-web.cjs
          git diff --exit-code -- campaign-expansion.html dist/campaign-expansion-data.js research/exports/v12-*.csv operational-effects.html dossier-audit.html research/exports/operational-effects.csv research/exports/dossier-audit.csv index.html dist/force-rosters-data.js research/exports/force-rosters.csv research/exports/campaign-coverage.csv research/exports/campaign-missions.csv europe.html dist/europe-index.js formations.html operational-balance.html dist/operational-balance-index.js research/exports/operational-balance*.csv dist/atlas-v75-performance-data.js
      - name: Dependency-free Atlas regression suites
        run: |
          set -eu
          for file in \
            tests/build.cjs tests/force-rosters.cjs tests/operational-effects.cjs \
            tests/data.cjs tests/v6.cjs tests/v7.cjs \
            tests/v71.cjs tests/v72.cjs tests/v73.cjs tests/v74.cjs \
            tests/render.cjs tests/tooltips.cjs \
            tests/v75.cjs tests/v75-model.cjs tests/v75-aircraft.cjs \
            tests/operations-1944.cjs; do
            echo "RUN $file"
            node "$file"
          done
      - name: Distinguish browser tests from core checks
        run: echo "Full Playwright/Chromium browser tests are covered separately by the v7.5 preview workflow or an explicit local run."
