name: Western air war publication verification

on:
  pull_request:
    paths:
      - '.github/workflows/atlas-may-source-verification.yml'

permissions:
  contents: read
  actions: read

jobs:
  published-revision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6801b69d0962ef0fec813ba320e014c1017ac96a
      - name: Find the existing main publication checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run list --repo hound83/ww2-airwar --workflow atlas-v86-live.yml
          --commit 6801b69d0962ef0fec813ba320e014c1017ac96a --limit 5
          --json databaseId,headSha,event,status,conclusion,url
      - name: Verify the exact live Pages assets
        run: node scripts/verify-v86-live.cjs
