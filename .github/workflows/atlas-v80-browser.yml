name: Atlas v8 campaign browser QA

on:
  pull_request:
    paths:
      - 'grand-air-war-v80.html'
      - 'dist/grand-air-war-v80-*'
      - 'dist/grand-air-war-v77-campaigns.js'
      - 'dist/normandy-1944-story.js'
      - 'tests/grand-air-war-v80-*'
      - '.github/workflows/atlas-v80-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser smoke dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Desktop and mobile campaign QA
        run: node tests/grand-air-war-v80-browser.cjs
      - name: Save screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v80-browser-qa
          path: v80-qa-*.png
          if-no-files-found: ignore
