name: Atlas v8 campaign browser QA

on:
  pull_request:
    paths:
      - 'grand-air-war-v80.html'
      - 'operations-1944.html'
      - 'dist/operations-1944.*'
      - 'research/transcriptions/operations-january-june-1944.json'
      - 'tests/operations-1944-browser.cjs'
      - 'dist/grand-air-war-v80-*'
      - 'dist/grand-air-war-v77-campaigns.js'
      - 'dist/grand-air-war-v86*'
      - 'dist/grand-air-war-v88*'
      - 'dist/grand-air-war-v90*'
      - 'research/transcriptions/claims-losses-v88.json'
      - 'research/transcriptions/battle-of-britain-campaign-claims-1940.json'
      - 'research/transcriptions/normandy-v86-operations.json'
      - 'tests/grand-air-war-v86.cjs'
      - 'dist/normandy-1944-story.js'
      - 'tests/grand-air-war-v80-*'
      - '.github/workflows/atlas-v80-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser smoke dependencies
        run: |
          npm install --no-save playwright
          browser_path="$(command -v google-chrome)"
          printf 'ATLAS_CHROMIUM_PATH=%s\n' "$browser_path" >> "$GITHUB_ENV"
      - name: Desktop and mobile campaign QA
        run: node tests/grand-air-war-v80-browser.cjs
      - name: Save screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v80-browser-qa
          path: |
            v80-qa-*.png
            v80-qa-layout-report.json
            operations-1944-qa-*.png
          if-no-files-found: ignore
