name: Atlas v8 campaign browser QA

on:
  pull_request:
    paths:
      - 'grand-air-war-v80.html'
      - 'operations-1944.html'
      - 'bodenplatte.html'
      - 'narvik.html'
      - 'big-week.html'
      - 'dist/narvik.html'
      - 'dist/campaign-studies.css'
      - 'dist/grand-air-war-v80-studies.js'
      - 'research/transcriptions/narvik-daily-1940.json'
      - 'scripts/build-narvik.cjs'
      - 'tests/campaign-review-browser.cjs'
      - 'dieppe.html'
      - 'sicily.html'
      - 'dist/sicily.*'
      - 'research/transcriptions/sicily-air-campaign-1943.json'
      - 'tests/sicily-browser.cjs'
      - 'malta.html'
      - 'dist/malta.*'
      - 'research/transcriptions/malta-air-campaign-1940-1942.json'
      - 'tests/malta-browser.cjs'
      - 'reich-defence.html'
      - 'dist/reich-defence.*'
      - 'research/transcriptions/reich-defence-1943-1945.json'
      - 'tests/reich-defence-browser.cjs'
      - 'bagration.html'
      - 'dist/bagration.*'
      - 'research/transcriptions/bagration-air-campaign-1944.json'
      - 'tests/bagration-browser.cjs'
      - 'dist/bodenplatte*'
      - 'research/transcriptions/bodenplatte-*'
      - 'research/transcriptions/wikipedia-followup-evidence-2026-11-12.json'
      - 'tests/bodenplatte-browser.cjs'
      - 'dist/operations-1944.*'
      - 'research/transcriptions/operations-january-june-1944.json'
      - 'research/transcriptions/davis-western-targets-may-july-1944.csv'
      - 'tests/operations-1944-browser.cjs'
      - 'dist/grand-air-war-v80-*'
      - 'dist/grand-air-war-v77-campaigns.js'
      - 'dist/grand-air-war-v86*'
      - 'dist/grand-air-war-v88*'
      - 'dist/grand-air-war-v90*'
      - 'research/transcriptions/claims-losses-v88.json'
      - 'research/transcriptions/battle-of-britain-campaign-claims-1940.json'
      - 'research/transcriptions/normandy-v86-operations.json'
      - 'tests/grand-air-war-v86.cjs'
      - 'dist/normandy-1944-story.js'
      - 'tests/grand-air-war-v80-*'
      - '.github/workflows/atlas-v80-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser smoke dependencies
        run: |
          npm install --no-save playwright
          browser_path="$(command -v google-chrome)"
          printf 'ATLAS_CHROMIUM_PATH=%s\n' "$browser_path" >> "$GITHUB_ENV"
      - name: Desktop and mobile campaign QA
        run: node tests/grand-air-war-v80-browser.cjs
      - name: Check out the published comparison for visual review
        if: always()
        uses: actions/checkout@v4
        with:
          ref: 03081e77b36a63da29960205167a41f39f7fcc84
          path: visual-baseline
      - name: Compare campaign reading views
        if: always()
        run: |
          python3 -m http.server 4986 --directory visual-baseline >/dev/null 2>&1 &
          node <<'NODE'
          const {chromium}=require("playwright");
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.ATLAS_CHROMIUM_PATH,args:["--no-sandbox"]});
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true});
            await page.goto("http://127.0.0.1:4986/grand-air-war-v80.html?campaign=norway#campaign-dossier",{waitUntil:"domcontentloaded"});
            await page.locator("#dossier-title").evaluate(el=>el.scrollIntoView({block:"start"}));
            await page.locator("#campaign-dossier").screenshot({path:"v80-qa-prior-norway.png"});
            await browser.close();
          })().catch(err=>{console.error(err);process.exitCode=1;});
          NODE
          python3 -m pip install --target "$RUNNER_TEMP/atlas-preview-py" Pillow --quiet
          PYTHONPATH="$RUNNER_TEMP/atlas-preview-py" python3 - <<'PY'
          from PIL import Image,ImageOps,ImageDraw
          import os,base64,io
          files=[("Prior Norway dossier","v80-qa-prior-norway.png"),("Norway dossier with evidence","v80-qa-dossier-review-390.png"),("Narvik study","v80-qa-norway-study-390.png"),("Big Week study","v80-qa-bigweek-study-390.png")]
          sheet=Image.new("RGB",(640,900),"white")
          for i,(label,path) in enumerate(files):
              if not os.path.exists(path): continue
              x,y=(i%2)*320,(i//2)*450
              part=Image.open(path).convert("RGB")
              part.thumbnail((315,422))
              sheet.paste(part,(x,y+20))
              ImageDraw.Draw(sheet).text((x+3,y+3),label,fill="black")
          output=io.BytesIO()
          sheet.save(output,format="JPEG",quality=50,optimize=True)
          print("ATLAS_VISUAL_REVIEW "+base64.b64encode(output.getvalue()).decode())
          PY
      - name: Save screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v80-browser-qa
          path: |
            v80-qa-*.png
            v80-qa-layout-report.json
            operations-1944-qa-*.png
          if-no-files-found: ignore
